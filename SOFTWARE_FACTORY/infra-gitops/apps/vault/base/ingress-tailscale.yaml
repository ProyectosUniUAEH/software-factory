# Vault UI - Private access via Tailscale
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-ui
  namespace: vault
  labels:
    app: vault
    software-factory.io/exposure: private
  annotations:
    tailscale.com/hostname: "vault"
    tailscale.com/tags: "tag:k8s"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: vault
      port:
        number: 8200
