apiVersion: v1
kind: Secret
metadata:
  name: datastore-credentials
  labels:
    app: datastore
type: Opaque
# NOTA: no pongas credenciales reales en Git. Usa Sealed Secrets / Vault,
# o crea el secret en el cluster (kubectl create secret) e ignora este manifiesto.
stringData:
  root-username: "admin"
  root-password: "REPLACE_WITH_SEALED_SECRET"
