apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-api
  namespace: prod
  labels:
    app: homepage-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage-api
  template:
    metadata:
      labels:
        app: homepage-api
    spec:
      containers:
        - name: app
          image: nginx:stable-alpine
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: homepage-api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
