name: MCP autonomy checks
on:
  pull_request:
    paths:
      - 'SOFTWARE_FACTORY/kaanbal-api/**'
      - 'SOFTWARE_FACTORY/kaanbal-mcp/**'
      - 'SOFTWARE_FACTORY/kaanbal-console/**'
      - 'SOFTWARE_FACTORY/infra-gitops/addons/agent-autonomy/**'
      - '.github/workflows/autonomy-checks.yml'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'SOFTWARE_FACTORY/kaanbal-api/**'
      - 'SOFTWARE_FACTORY/kaanbal-mcp/**'
      - 'SOFTWARE_FACTORY/kaanbal-console/**'
      - 'SOFTWARE_FACTORY/infra-gitops/addons/agent-autonomy/**'
      - '.github/workflows/autonomy-checks.yml'
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install fastapi==0.109.0 httpx==0.26.0 pydantic==2.5.3 pymongo==4.8.0 python-jose==3.3.0
      - name: Offline authorization and workspace contracts
        working-directory: SOFTWARE_FACTORY/kaanbal-api
        run: |
          python tests/test_access_control.py
          python tests/test_access_store.py
          python tests/test_autonomy.py
          python tests/test_autonomy_api.py
          python tests/test_autonomy_flow.py
  mcp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r SOFTWARE_FACTORY/kaanbal-mcp/requirements.txt
      - run: python SOFTWARE_FACTORY/kaanbal-mcp/tests/test_tools.py
  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: SOFTWARE_FACTORY/kaanbal-console
      - run: npm run build
        working-directory: SOFTWARE_FACTORY/kaanbal-console
