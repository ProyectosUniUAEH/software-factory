name: Installer checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test installer without real credentials
        env:
          KAANBAL_INSTALLER_STATE_DIR: /tmp/kaanbal-ci-state
          KAANBAL_CREDENTIALS_FILE: /tmp/kaanbal-ci-state/synthetic-credentials
        run: |
          python -m pip install PyYAML==6.0.2
          python -m unittest discover -s SOFTWARE_FACTORY/installer -p 'test_*.py'
          bash -n install.sh
          bash -n SOFTWARE_FACTORY/install.sh
          node --check SOFTWARE_FACTORY/installer/static/app.js
      - name: Scan current tree (historical publication audit is separate)
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact=100 --no-banner
