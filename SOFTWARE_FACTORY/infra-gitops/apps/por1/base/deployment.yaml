apiVersion: apps/v1
kind: Deployment
metadata:
  name: por1
  namespace: prod
  labels:
    app: por1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: por1
  template:
    metadata:
      labels:
        app: por1
    spec:
      containers:
        - name: app
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
