apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
namespace: dev

commonLabels:
  environment: dev

images:
  - name: nginx:stable-alpine
    newName: andresupmh/homepage
    newTag: dev-2b5b7c1

patches:
- target:
    kind: Deployment
    name: homepage
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1

- target:
    kind: Ingress
    name: homepage
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: dev-homepage.futurefarms.mx
    - op: replace
      path: /spec/tls/0/hosts/0
      value: dev-homepage.futurefarms.mx
    - op: replace
      path: /spec/tls/0/secretName
      value: tls-dev-homepage

# Generated secrets by Kaanbal Engine
secretGenerator:
  - name: homepage-secrets
    literals:
      - APP_SECRET=CHANGE_ME
