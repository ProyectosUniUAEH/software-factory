# Tailscale L4 TCP access - generated by Kaanbal Engine
# Exposes raw TCP (port 5432) on the Tailnet for direct database connectivity
apiVersion: v1
kind: Service
metadata:
  name: fago-bd-postgres-ts
  labels:
    app: fago-bd-postgres
    software-factory.io/exposure: private-tcp
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
    tailscale.com/expose: "true"
    tailscale.com/hostname: "dev-fago-bd-postgres"
    tailscale.com/tags: "tag:k8s,tag:database"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: fago-bd-postgres
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: tcp
