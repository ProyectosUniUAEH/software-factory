# Auto-generated per-port public Ingress (http) - Kaanbal Engine
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-api-http
  labels:
    app: homepage-api
    software-factory.io/exposure: public
    software-factory.io/port: "http"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - homepage-api.futurefarms.mx
      secretName: tls-homepage-api-http
  rules:
    - host: homepage-api.futurefarms.mx
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage-api
                port:
                  number: 8000
