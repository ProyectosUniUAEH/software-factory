apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
namespace: prod

commonLabels:
  environment: prod

images:
  - name: nginx:stable-alpine
    newName: andresupmh/fago
    newTag: prod-963484e

patches:
- target:
    kind: Deployment
    name: fago
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1

- target:
    kind: Ingress
    name: fago
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: fago.futurefarms.mx
    - op: replace
      path: /spec/tls/0/hosts/0
      value: fago.futurefarms.mx
    - op: replace
      path: /spec/tls/0/secretName
      value: tls-fago

# Generated secrets by Kaanbal Engine
secretGenerator:
  - name: fago-secrets
    literals:
      - APP_SECRET=CHANGE_ME
